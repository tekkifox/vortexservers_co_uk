name: Redeploy Portainer stack

on:
  workflow_run:
    workflows:
      - Publish Docker image
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  # Name of the Portainer stack this repository deploys. The stack Id and
  # EndpointId are discovered from the API so they are never hardcoded.
  STACK_NAME: vortexservers_co_uk

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --hostname=gh-vortexservers-${{ github.run_id }}

      - name: Redeploy Portainer stack via API
        shell: bash
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail

          : "${PORTAINER_URL:?PORTAINER_URL secret is not set}"
          : "${PORTAINER_API_KEY:?PORTAINER_API_KEY secret is not set}"

          # Portainer on the tailnet serves a self-signed certificate, so -k is
          # required.
          PORTAINER_URL="${PORTAINER_URL%/}"
          COMPOSE_FILE="docker-compose.portainer.yml"

          [ -r "${COMPOSE_FILE}" ] || {
            echo "missing ${COMPOSE_FILE}" >&2
            exit 1
          }

          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          # Portainer can briefly answer 401 right after a fresh API key or
          # tailnet session, so retry transient auth/transport failures with a
          # growing backoff (as the old webhook call retried with --retry 3).
          # Prints the HTTP status; the response body goes to the given file.
          request() {
            local method="$1"
            local url="$2"
            local data_file="${3:-}"
            local out="$4"
            local attempt=1
            local max_attempts=4
            local status=""

            while [ "${attempt}" -le "${max_attempts}" ]; do
              if [ -n "${data_file}" ]; then
                status=$(curl -ksS -X "${method}" "${url}" \
                  -H "X-API-Key: ${PORTAINER_API_KEY}" \
                  -H "Content-Type: application/json" \
                  --data-binary "@${data_file}" \
                  -o "${out}" -w '%{http_code}') || status="000"
              else
                status=$(curl -ksS -X "${method}" "${url}" \
                  -H "X-API-Key: ${PORTAINER_API_KEY}" \
                  -o "${out}" -w '%{http_code}') || status="000"
              fi

              case "${status}" in
                401|408|429|5??)
                  if [ "${attempt}" -lt "${max_attempts}" ]; then
                    echo "Portainer ${method} ${url} returned HTTP ${status}; retrying in $((attempt * 5))s (${attempt}/${max_attempts})" >&2
                    sleep "$((attempt * 5))"
                  fi
                  ;;
                *)
                  break
                  ;;
              esac

              attempt=$((attempt + 1))
            done

            printf '%s' "${status}"
          }

          fail_if_not_2xx() {
            local status="$1"
            local what="$2"
            local body_file="$3"

            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "Portainer ${what} failed with HTTP status ${status}" >&2
              cat "${body_file}" >&2 || true
              exit 1
            fi
          }

          # --- Find the stack by name; never hardcode Id or EndpointId ---
          list_status=$(request GET "${PORTAINER_URL}/api/stacks" "" "${tmp}/stacks.json")
          fail_if_not_2xx "${list_status}" "GET /api/stacks" "${tmp}/stacks.json"

          stack_id=$(jq -er --arg name "${STACK_NAME}" \
            '[.[] | select(.Name == $name)][0] | .Id' "${tmp}/stacks.json") || {
            echo "Portainer stack '${STACK_NAME}' was not found in /api/stacks" >&2
            cat "${tmp}/stacks.json" >&2
            exit 1
          }
          endpoint_id=$(jq -er --arg name "${STACK_NAME}" \
            '[.[] | select(.Name == $name)][0] | .EndpointId' "${tmp}/stacks.json") || {
            echo "Portainer stack '${STACK_NAME}' has no EndpointId" >&2
            cat "${tmp}/stacks.json" >&2
            exit 1
          }

          for id in "${stack_id}" "${endpoint_id}"; do
            case "${id}" in
              ''|*[!0-9]*)
                echo "invalid Portainer id for stack '${STACK_NAME}': ${id}" >&2
                exit 1
                ;;
            esac
          done

          echo "Found Portainer stack '${STACK_NAME}': Id=${stack_id}, EndpointId=${endpoint_id}"

          # --- Read the stack's Env array; sending an empty Env would wipe the
          #     running stack's configuration ---
          detail_status=$(request GET "${PORTAINER_URL}/api/stacks/${stack_id}" "" "${tmp}/stack.json")
          fail_if_not_2xx "${detail_status}" "GET /api/stacks/${stack_id}" "${tmp}/stack.json"

          env_len=$(jq -er 'if (.Env | type) == "array" then (.Env | length) else error("Env is not an array") end' "${tmp}/stack.json") || {
            echo "Portainer stack '${STACK_NAME}' returned no Env array" >&2
            cat "${tmp}/stack.json" >&2
            exit 1
          }
          if [ "${env_len}" -eq 0 ]; then
            echo "refusing to redeploy '${STACK_NAME}' with an empty Env" >&2
            exit 1
          fi

          # --- Send this repository's compose file, the stack's own Env, and
          #     instruct Portainer to pull the newly published image ---
          jq --rawfile compose "${COMPOSE_FILE}" \
            '{StackFileContent: $compose, Env: .Env, PullImage: true}' \
            "${tmp}/stack.json" > "${tmp}/payload.json"

          put_status=$(request PUT "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}" "${tmp}/payload.json" "${tmp}/deploy.json")
          fail_if_not_2xx "${put_status}" "PUT /api/stacks/${stack_id}?endpointId=${endpoint_id}" "${tmp}/deploy.json"

          echo "Portainer stack '${STACK_NAME}' redeployed: Id=${stack_id}, EndpointId=${endpoint_id} (HTTP ${put_status})"
