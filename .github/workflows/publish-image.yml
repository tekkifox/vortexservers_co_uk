name: Publish Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "content/**"
      - "public/uploads/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build, build-arm64]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Verify both architecture digests are present
        run: |
          count="$(find /tmp/digests -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 digests, found $count"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  # The stack is owned by Ansible on the vortex host and lives at
  # /home/ross/stacks/vortex-vortexservers-co-uk. This job runs on the
  # self-hosted vortex runner and invokes the host deploy wrapper directly via
  # limited sudo, like tekkifox/vortexservers_iac deploy-stack.yml does.
  deploy:
    name: Deploy vortexservers
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - X64
      - vortexservers
    timeout-minutes: 30

    steps:
      - name: Validate the deploy inputs
        env:
          STACKS: vortex-vortexservers-co-uk
          ACTION: deploy
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy|restart) ;;
            *)
              echo "::error::action must be deploy or restart"
              exit 1
              ;;
          esac
          [[ -n "$STACKS" ]] || {
            echo "::error::stacks must not be empty"
            exit 1
          }
          IFS=',' read -r -a stack_list <<< "$STACKS"
          for stack in "${stack_list[@]}"; do
            if [[ ! "$stack" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::invalid stack name '$stack'; names must match ^[a-z0-9][a-z0-9-]*$"
              exit 1
            fi
          done
          echo "Validated: stacks=$STACKS action=$ACTION"

      - name: Deploy the stack on vortex
        env:
          STACKS: vortex-vortexservers-co-uk
          ACTION: deploy
        run: |
          set -euo pipefail
          echo "Running: sudo /usr/local/bin/vortex-deploy $STACKS $ACTION"
          sudo /usr/local/bin/vortex-deploy "$STACKS" "$ACTION"
